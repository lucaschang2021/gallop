[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "gallop-learning"
version = "1.2.0"
description = "Local-first evidence-driven Progressive Mentorship and Zero-Touch learning continuity."
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "Gallop contributors"}]
dependencies = ["jsonschema>=4.20,<5", "mcp>=1.30,<2"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.16,<1", "mypy>=1.18,<2"]

[project.scripts]
gallop = "gallop.cli:main"

[tool.setuptools.packages.find]
include = ["gallop*"]

[tool.setuptools.package-data]
gallop = ["schemas/*.json", "demo/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Zero-debt correctness gate. Broader style adoption is intentionally separate
# from the v1.2 sustained-use baseline and must not force unrelated rewrites.
select = ["E9", "F63", "F7", "F82"]

[tool.mypy]
python_version = "3.11"
files = ["gallop/progression", "gallop/automation/ports.py", "gallop/tutor"]
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
follow_imports = "skip"
