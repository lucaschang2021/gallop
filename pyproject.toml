[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "gallop-learning"
version = "0.1.0"
description = "Local-first orchestration for deliberate practice and mastery tracking."
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "Gallop contributors"}]
dependencies = ["jsonschema>=4.20,<5"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
gallop = "gallop.cli:main"

[tool.setuptools.packages.find]
include = ["gallop*"]

[tool.setuptools.package-data]
gallop = ["schemas/*.json", "demo/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
